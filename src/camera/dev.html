<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Camera dev page</title>
    <link rel="stylesheet" href="./dev.css" />
  </head>
  <body>
    <h1>Camera dev page</h1>
    <p id="status">Starting camera…</p>
    <p id="nose"></p>
    <p id="fps"></p>

    <!-- buttons to test stopCamera() and setOverlayVisible() -->
    <div id="controls">
      <button id="start-button" disabled>Start Camera</button>
      <button id="stop-button" disabled>Stop Camera</button>
      <label>
        <input type="checkbox" id="overlay-checkbox" checked />
        Show overlay
      </label>
    </div>

    <div id="camera-stage">
      <video id="camera-video" autoplay playsinline muted></video>
      <canvas id="camera-overlay"></canvas>
      <!--transparent drawing layer that sits exactly over the video-->
    </div>

    <!-- autoplay + playsinline + muted: start playing on their own, inside the page -->

    <script type="module" src="./dev.js"></script>
  </body>
</html>
